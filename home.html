<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - My Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #fdfbfb, #ebedee);
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topnav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e2f;
            padding: 15px 40px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
        }

        .nav-links a {
            margin-left: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            text-align: center;
            background-color: #ffffff;
            padding: 60px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            flex: 1;
        }

        h1 {
            font-size: 42px;
            color: #1e1e2f;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #555;
            line-height: 1.6;
        }

        .btn {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 24px;
            background-color: #00bcd4;
            color: #fff;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0198a8;
        }

        .footer {
            background-color: #1e1e2f;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="topnav">
        <div class="logo">My Portfolio</div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <div class="container">
        <h1>Welcome to My Portfolio</h1>
        <p>Hi, I'm Kaviya R. I design and build modern websites and web applications that are clean, responsive, and user-friendly.</p>
        <a class="btn" href="projects.html">View My Projects</a>
    </div>

    <div class="footer">
        &copy; 2025 Kaviya R. All Rights Reserved | Designed with ❤️
    </div>

</body>
</html>
